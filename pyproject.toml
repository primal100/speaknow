[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speaknow-gui"
version = "0.2.1"
description = "Realtime AI Voice Interface using OpenAI Realtime API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Paul Martin", email = "paulmartin4work@protonmail.com"}
]
dependencies = [
    "openai[realtime]",
    "google-genai",
    "sounddevice",
    "audioop-lts; python_version >= '3.13'",
    "numpy",
    "textual",
    "textual-dev",
    "textual_serve",
    "PyYAML",
    "typing_extensions",
    "gpt-token-tracker"
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "pytest-timeout>=2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["speaknow", "speaknow_ai_realtime_text_to_speech"]
omit = ["*/app_css.py", "*/config_css.py", "*/__version__.py"]

[project.scripts]
speaknow = "speaknow:run"
speaknow-serve = "speaknow_serve:run"

[tool.setuptools]
include-package-data = true
py-modules = ["speaknow", "speaknow_serve"]

[tool.setuptools.package-data]
"speaknow_ai_realtime_text_to_speech" = ["conf/*.conf"]

[tool.setuptools.packages.find]
where = ["."]
include = ["speaknow_ai_realtime_text_to_speech*"]
